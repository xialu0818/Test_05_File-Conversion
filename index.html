<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 设置页面编码为UTF-8 -->
    <meta charset="UTF-8">
    <!-- 设置视口适配电脑端 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 页面标题 -->
    <title>视频提取音频工具 - 本地离线运行</title>
    <!-- 通过jsDelivr CDN加载FFmpeg核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/ffmpeg.min.js"></script>
    <!-- 通过jsDelivr CDN加载FFmpeg工具库 -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/index.min.js"></script>
    <style>
        /* ========== 全局样式重置 ========== */
        /* 清除所有元素默认内外边距和边框盒模型 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ========== 美化滚动条 ========== */
        /* 自定义网页滚动条宽度和轨道背景 */
        ::-webkit-scrollbar {
            width: 10px;
        }
        /* 滚动条轨道背景透明 */
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        /* 滚动条滑块渐变圆角 */
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #60a5fa, #3b82f6);
            border-radius: 10px;
        }
        /* 滚动条滑块悬停加深 */
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #3b82f6, #2563eb);
        }

        /* ========== 页面整体样式 ========== */
        /* 设置body多层渐变背景，居中布局，最小高度满屏 */
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            /* 多层渐变营造梦幻蓝白氛围 */
            background:
                radial-gradient(ellipse at 20% 0%, rgba(96, 165, 250, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(167, 139, 250, 0.2) 0%, transparent 50%),
                linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 40%, #eef2ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            color: #333;
            position: relative;
            overflow-x: hidden;
        }

        /* ========== 背景浮动光晕装饰 ========== */
        /* 固定定位的彩色光晕blob，营造空间层次感 */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: floatBlob 12s ease-in-out infinite;
        }
        /* 左上角蓝色光晕 */
        body::before {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.3), transparent 70%);
            top: -100px;
            left: -100px;
        }
        /* 右下角紫色光晕，延迟动画错开节奏 */
        body::after {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.25), transparent 70%);
            bottom: -80px;
            right: -80px;
            animation-delay: -6s;
        }
        /* 光晕浮动动画关键帧 */
        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* ========== 主卡片容器 ========== */
        /* 毛玻璃质感卡片，双层阴影，顶部高光边框 */
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            /* 双层阴影：外层柔光 + 内层近距投影 */
            box-shadow:
                0 20px 60px rgba(37, 99, 235, 0.12),
                0 8px 24px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            padding: 44px;
            max-width: 740px;
            width: 100%;
            position: relative;
            z-index: 1;
            /* 卡片渐入动画 */
            animation: cardFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        /* 卡片渐入动画关键帧 */
        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ========== 标题样式 ========== */
        /* 主标题渐变文字效果，居中显示 */
        .main-title {
            text-align: center;
            /* 渐变文字：蓝到紫 */
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        /* 副标题描述文字 */
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
            /* 副标题下方装饰渐变线 */
            position: relative;
            padding-bottom: 20px;
        }
        /* 副标题底部渐变装饰线 */
        .subtitle::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        }

        /* ========== 隐私提示横幅 ========== */
        /* 玻璃质感绿色提示框，带左侧高亮条 */
        .privacy-notice {
            background: linear-gradient(135deg, rgba(236, 253, 245, 0.9) 0%, rgba(209, 250, 229, 0.8) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(110, 231, 183, 0.6);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            /* 左侧渐变高亮条 */
            border-left: 4px solid #10b981;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.1);
            transition: transform 0.3s ease;
        }
        /* 隐私提示悬停轻微上浮 */
        .privacy-notice:hover {
            transform: translateX(4px);
        }

        /* 隐私提示图标带呼吸动画 */
        .privacy-notice .icon {
            font-size: 24px;
            flex-shrink: 0;
            animation: breathe 2.5s ease-in-out infinite;
        }
        /* 图标呼吸缩放动画 */
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* 隐私提示文字 */
        .privacy-notice .text {
            color: #065f46;
            font-size: 14px;
            line-height: 1.6;
            font-weight: 500;
        }

        /* ========== 文件上传区域 ========== */
        /* 渐变虚线边框的拖拽上传区，精致hover效果 */
        .upload-area {
            /* 渐变虚线边框（用border-image实现） */
            border: 2px dashed transparent;
            background:
                linear-gradient(#f8faff, #f8faff) padding-box,
                linear-gradient(135deg, #93c5fd, #c4b5fd) border-box;
            border-radius: 16px;
            padding: 44px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        /* 上传区内部光泽装饰（hover时显现） */
        .upload-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.08), transparent);
            transition: left 0.6s ease;
        }
        /* hover时光泽划过 */
        .upload-area:hover::before {
            left: 100%;
        }

        /* 拖拽悬停时发光上浮效果 */
        .upload-area:hover,
        .upload-area.dragover {
            border-color: transparent;
            background:
                linear-gradient(#eff6ff, #eff6ff) padding-box,
                linear-gradient(135deg, #3b82f6, #8b5cf6) border-box;
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(59, 130, 246, 0.2);
        }
        /* 拖拽悬停时光环动画 */
        .upload-area.dragover {
            animation: pulseGlow 1.5s ease-in-out infinite;
        }
        /* 脉冲发光动画 */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 12px 32px rgba(59, 130, 246, 0.2); }
            50% { box-shadow: 0 12px 40px rgba(59, 130, 246, 0.4); }
        }

        /* 上传区域大图标带浮动动画 */
        .upload-area .upload-icon {
            font-size: 52px;
            margin-bottom: 14px;
            display: block;
            animation: floatIcon 3s ease-in-out infinite;
        }
        /* 图标上下浮动动画 */
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* 上传区域主文字 */
        .upload-area .upload-text {
            color: #2563eb;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        /* 上传区域次文字 */
        .upload-area .upload-hint {
            color: #64748b;
            font-size: 13px;
        }

        /* 隐藏的文件选择input */
        #fileInput {
            display: none;
        }

        /* ========== 已选文件信息展示 ========== */
        /* 玻璃质感文件信息卡片，选中后带渐入动画 */
        .file-info {
            background: linear-gradient(135deg, rgba(240, 247, 255, 0.95), rgba(219, 234, 254, 0.9));
            backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: none;
            align-items: center;
            gap: 14px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-left: 4px solid #3b82f6;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.08);
        }

        /* 文件信息显示时带滑入动画 */
        .file-info.show {
            display: flex;
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        /* 滑入动画关键帧 */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 文件图标带轻微弹跳 */
        .file-info .file-icon {
            font-size: 30px;
            flex-shrink: 0;
            animation: bounceIn 0.5s ease;
        }
        /* 弹跳进入动画 */
        @keyframes bounceIn {
            0% { transform: scale(0); }
            60% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* 文件文字信息区 */
        .file-info .file-details {
            flex: 1;
            min-width: 0;
        }

        /* 文件名 */
        .file-info .file-name {
            color: #1e40af;
            font-weight: 600;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 文件大小 */
        .file-info .file-size {
            color: #64748b;
            font-size: 12px;
            margin-top: 3px;
        }

        /* 移除文件按钮 */
        .file-info .remove-btn {
            background: rgba(239, 68, 68, 0.1);
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 16px;
            padding: 6px 10px;
            border-radius: 8px;
            transition: all 0.2s;
            flex-shrink: 0;
            font-weight: 700;
        }

        .file-info .remove-btn:hover {
            background: #ef4444;
            color: #fff;
            transform: rotate(90deg);
        }

        /* ========== 参数配置面板 ========== */
        /* 参数面板标题带渐变左边框 */
        .section-title {
            color: #1e40af;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            padding-left: 12px;
            border-left: 4px solid transparent;
            border-image: linear-gradient(180deg, #3b82f6, #8b5cf6) 1;
        }

        /* 玻璃质感参数面板容器 */
        .params-panel {
            background: linear-gradient(135deg, rgba(250, 251, 255, 0.9), rgba(241, 245, 255, 0.8));
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 26px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        /* 参数网格布局，两列 */
        .params-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* 单个参数项 */
        .param-item {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        /* 参数标签 */
        .param-label {
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 下拉选择框样式 - 精致圆角带过渡 */
        .param-select,
        .param-input {
            padding: 10px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            color: #1e293b;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.25s ease;
            outline: none;
            font-family: inherit;
            cursor: pointer;
        }

        /* 下拉框和输入框聚焦样式 - 蓝色光晕 */
        .param-select:focus,
        .param-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
            background: #fff;
        }
        /* select悬停效果 */
        .param-select:hover {
            border-color: #93c5fd;
        }

        /* 时间截取区标题 */
        .time-section {
            grid-column: 1 / -1;
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px dashed rgba(203, 213, 225, 0.6);
        }

        /* 时间截取开关 */
        .time-toggle-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        /* 开关复选框放大并着色 */
        .time-toggle-wrap input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #3b82f6;
            transition: transform 0.2s;
        }
        /* checkbox悬停放大 */
        .time-toggle-wrap input[type="checkbox"]:hover {
            transform: scale(1.15);
        }

        /* 开关标签 */
        .time-toggle-wrap label {
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        /* 时间输入容器 */
        .time-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* 时间输入项 */
        .time-input-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* 时间输入禁用时样式 */
        .time-inputs.disabled .param-input {
            background: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
            border-color: #e2e8f0;
        }

        /* ========== 操作按钮 ========== */
        /* 开始转换按钮 - 渐变+光泽+悬浮动画 */
        .convert-btn {
            width: 100%;
            padding: 15px 24px;
            /* 蓝紫渐变背景 */
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 50%, #8b5cf6 100%);
            background-size: 200% 200%;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            /* 多层阴影营造立体感 */
            box-shadow:
                0 6px 20px rgba(37, 99, 235, 0.35),
                0 2px 8px rgba(99, 102, 241, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }
        /* 按钮内部光泽扫过效果 */
        .convert-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }
        /* 按钮悬停：上浮+光泽扫过+渐变移动 */
        .convert-btn:hover:not(:disabled)::before {
            left: 100%;
        }
        .convert-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            background-position: 100% 100%;
            box-shadow:
                0 10px 28px rgba(37, 99, 235, 0.45),
                0 4px 12px rgba(99, 102, 241, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        /* 按钮点击效果 */
        .convert-btn:active:not(:disabled) {
            transform: translateY(-1px);
        }

        /* 按钮禁用状态 */
        .convert-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* ========== 进度和状态区域 ========== */
        /* 玻璃质感状态面板 */
        .status-panel {
            display: none;
            background: linear-gradient(135deg, rgba(248, 250, 252, 0.95), rgba(241, 245, 249, 0.9));
            backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }

        /* 状态面板显示时带渐入 */
        .status-panel.show {
            display: block;
            animation: cardFadeIn 0.4s ease;
        }

        /* 顶部状态文字和图标 */
        .status-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        /* 状态图标带旋转动画（处理中时） */
        .status-icon {
            font-size: 20px;
        }
        /* processing状态图标旋转 */
        .status-text.processing ~ .status-icon,
        .status-icon.spinning {
            animation: spin 1s linear infinite;
        }
        /* 旋转动画 */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 状态文字 */
        .status-text {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        /* 进度条容器 - 圆角带内阴影 */
        .progress-wrap {
            background: linear-gradient(180deg, #e2e8f0, #cbd5e1);
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            margin-bottom: 8px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.08);
        }

        /* 进度条填充 - 渐变+流光动画 */
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #6366f1, #8b5cf6);
            background-size: 200% 100%;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 10px;
            position: relative;
            animation: progressShine 2s linear infinite;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
        }
        /* 进度条流光动画 */
        @keyframes progressShine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        /* 进度条表面光泽扫过 */
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shine 1.8s ease-in-out infinite;
        }
        /* 表面光泽动画 */
        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* 进度百分比文字 */
        .progress-text {
            text-align: right;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
        }

        /* 不同状态颜色 */
        .status-text.loading { color: #2563eb; }
        .status-text.processing { color: #d97706; }
        .status-text.success { color: #059669; }
        .status-text.error { color: #dc2626; }

        /* ========== 结果区域 ========== */
        /* 玻璃质感成功面板，带渐入和左侧高亮 */
        .result-panel {
            display: none;
            background: linear-gradient(135deg, rgba(240, 253, 244, 0.95), rgba(220, 252, 231, 0.85));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(134, 239, 172, 0.6);
            border-left: 4px solid #10b981;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 28px rgba(16, 185, 129, 0.12);
        }

        /* 结果面板显示时带弹性渐入 */
        .result-panel.show {
            display: block;
            animation: resultPop 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        /* 结果弹出动画 */
        @keyframes resultPop {
            from {
                opacity: 0;

        /* 弹窗内容 - 玻璃质感+弹性动画 */

</head>
<body>
    <!-- ========== 主容器 ========== -->
    <div class="container">

        <!-- ========== 转换参数配置面板 ========== -->

                            <input type="number" class="param-input" id="startTime" placeholder="起始时间（秒）" min="0" step="0.1" disabled>
                        </div>

                            <label class="param-label">结束时间（秒，例：120）</label>
                            <input type="number" class="param-input" id="endTime" placeholder="结束时间（秒）" min="0" step="0.1" disabled>
                        </div>

            </div>
        </div>

        <!-- ========== 开始转换按钮 ========== -->

        <!-- ========== 进度和状态展示区 ========== -->
        <div class="status-panel" id="statusPanel">
            <div class="status-header">
                <span class="status-icon" id="statusIcon">⏳</span>
                <span class="status-text" id="statusText">正在加载FFmpeg内核...</span>
            </div>
            <div class="progress-wrap">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <!-- ========== 转换结果展示区 ========== -->
        <div class="result-panel" id="resultPanel">
            <div class="result-title"><span class="check-icon">✅</span> 转换成功！导出的音频文件：</div>
            <!-- 内置音频播放器 -->
            <div class="player-wrap">
                <audio id="audioPlayer" controls></audio>
            </div>
            <!-- 自定义文件名和下载按钮 -->
            <div class="download-wrap">
                <input type="text" class="filename-input" id="filenameInput" placeholder="请输入文件名（不含扩展名）">
                <button class="download-btn" id="downloadBtn">⬇️ 下载音频</button>
            </div>
        </div>

        <!-- ========== 页脚说明 ========== -->
        <div class="footer">
            💡 使用提示：首次使用会自动下载FFmpeg内核（约30MB），后续打开会缓存复用，无需重复下载<br>
            🌐 纯前端离线工具 · 基于 ffmpeg.wasm 多线程版本构建
        </div>
    </div>

    <!-- ========== 错误提示弹窗 ========== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">❌</div>
            <div class="modal-title" id="modalTitle">出错啦</div>
            <div class="modal-message" id="modalMessage"></div>
            <button class="modal-close-btn" id="modalCloseBtn">我知道了</button>
        </div>
    </div>

    <script>
        // ============================================================
        // 全局变量声明区
        // ============================================================

        // FFmpeg实例变量，初始为空
        let ffmpeg = null;
        // FFmpeg是否已加载完成的标志
        let ffmpegLoaded = false;
        // 用户选择的视频文件对象
        let selectedFile = null;
        // 导出的音频Blob对象（用于播放和下载）
        let outputAudioBlob = null;
        // 导出的音频文件扩展名
        let outputExtension = '';
        // 上一次音频Blob的URL（用于释放内存）
        let lastObjectUrl = null;

        // ============================================================
        // DOM元素获取区
        // ============================================================

        // 获取上传区域元素
        const uploadArea = document.getElementById('uploadArea');
        // 获取隐藏的文件选择input
        const fileInput = document.getElementById('fileInput');
        // 获取文件信息显示容器
        const fileInfo = document.getElementById('fileInfo');
        // 获取文件名显示
        const fileName = document.getElementById('fileName');
        // 获取文件大小显示
        const fileSize = document.getElementById('fileSize');
        // 获取移除文件按钮
        const removeBtn = document.getElementById('removeBtn');
        // 获取输出格式选择框
        const formatSelect = document.getElementById('formatSelect');
        // 获取比特率选择框
        const bitrateSelect = document.getElementById('bitrateSelect');
        // 获取声道选择框
        const channelSelect = document.getElementById('channelSelect');
        // 获取时间截取开关
        const timeToggle = document.getElementById('timeToggle');
        // 获取时间输入区容器
        const timeInputs = document.getElementById('timeInputs');
        // 获取起始时间输入
        const startTimeInput = document.getElementById('startTime');
        // 获取结束时间输入
        const endTimeInput = document.getElementById('endTime');
        // 获取转换按钮
        const convertBtn = document.getElementById('convertBtn');
        // 获取状态面板容器
        const statusPanel = document.getElementById('statusPanel');
        // 获取状态图标
        const statusIcon = document.getElementById('statusIcon');
        // 获取状态文字
        const statusText = document.getElementById('statusText');
        // 获取进度条
        const progressBar = document.getElementById('progressBar');
        // 获取进度百分比文字
        const progressText = document.getElementById('progressText');
        // 获取结果面板
        const resultPanel = document.getElementById('resultPanel');
        // 获取音频播放器
        const audioPlayer = document.getElementById('audioPlayer');
        // 获取文件名输入框
        const filenameInput = document.getElementById('filenameInput');
        // 获取下载按钮
        const downloadBtn = document.getElementById('downloadBtn');
        // 获取弹窗遮罩
        const modalOverlay = document.getElementById('modalOverlay');
        // 获取弹窗图标
        const modalIcon = document.getElementById('modalIcon');
        // 获取弹窗标题
        const modalTitle = document.getElementById('modalTitle');
        // 获取弹窗正文
        const modalMessage = document.getElementById('modalMessage');
        // 获取弹窗关闭按钮
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        // ============================================================
        // 工具函数区
        // ============================================================

        /**
         * 格式化文件大小为人类可读字符串
         * @param {number} bytes - 文件字节数
         * @returns {string} 格式化后的文件大小，如 "15.3 MB"
         */
        function formatFileSize(bytes) {
            // 如果小于1KB，直接显示字节
            if (bytes < 1024) return bytes + ' B';
            // 如果小于1MB，显示KB
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            // 如果小于1GB，显示MB
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            // 否则显示GB
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }

        /**
         * 显示自定义错误/信息弹窗
         * @param {string} title - 弹窗标题
         * @param {string} message - 弹窗正文内容
         * @param {string} icon - 弹窗图标（默认❌）
         */
        function showModal(title, message, icon = '❌') {
            // 设置弹窗图标
            modalIcon.textContent = icon;
            // 设置弹窗标题
            modalTitle.textContent = title;
            // 设置弹窗正文
            modalMessage.textContent = message;
            // 显示弹窗遮罩
            modalOverlay.classList.add('show');
        }

        /**
         * 关闭弹窗
         */
        function hideModal() {
            // 移除show类隐藏弹窗
            modalOverlay.classList.remove('show');
        }

        /**
         * 更新UI状态（进度、文字、图标）
         * @param {string} text - 状态文字
         * @param {string} type - 状态类型：loading/processing/success/error
         * @param {number} progress - 进度百分比0-100
         */
        function updateStatus(text, type, progress) {
            // 显示状态面板
            statusPanel.classList.add('show');
            // 更新状态文字
            statusText.textContent = text;
            // 移除所有状态类后重新添加当前状态类
            statusText.classList.remove('loading', 'processing', 'success', 'error');
            statusText.classList.add(type);
            // 根据状态类型设置对应图标
            switch (type) {
                case 'loading': statusIcon.textContent = '⏳'; break;     // 加载中
                case 'processing': statusIcon.textContent = '🔄'; break;  // 处理中
                case 'success': statusIcon.textContent = '✅'; break;     // 成功
                case 'error': statusIcon.textContent = '❌'; break;       // 失败
            }
            // 如果传入进度值，更新进度条和文字
            if (progress !== undefined) {
                const p = Math.min(100, Math.max(0, progress));
                progressBar.style.width = p + '%';
                progressText.textContent = Math.round(p) + '%';
            }
        }

        /**
         * 隐藏状态面板
         */
        function hideStatus() {
            statusPanel.classList.remove('show');
        }

        /**
         * 释放旧的Blob URL，防止内存泄漏
         */
        function revokeLastObjectUrl() {
            // 如果存在上一次的URL，调用revoke释放
            if (lastObjectUrl) {
                URL.revokeObjectURL(lastObjectUrl);
                lastObjectUrl = null;
            }
        }

        /**
         * 清理内存：销毁FFmpeg实例，清空变量
         */
        async function cleanupMemory() {
            try {
                // 如果FFmpeg实例存在
                if (ffmpeg) {
                    // 退出FFmpeg进程，释放内存
                    await ffmpeg.terminate();
                    ffmpeg = null;
                }
            } catch (e) {
                // 忽略终止时的错误，只记录日志
                console.warn('清理FFmpeg时发生非致命错误:', e);
            }
            // 清空导出的音频Blob
            outputAudioBlob = null;
            // 释放Blob URL
            revokeLastObjectUrl();
        }

        // ============================================================
        // FFmpeg加载相关函数
        // ============================================================

        /**
         * 初始化并加载FFmpeg内核，带持久缓存检测
         * @returns {Promise<boolean>} 加载成功返回true
         */
        async function loadFFmpeg() {
            // 如果已经加载过，直接返回成功
            if (ffmpegLoaded && ffmpeg) {
                return true;
            }

            try {
                // 检测浏览器是否支持SharedArrayBuffer（多线程必需）
                if (typeof SharedArrayBuffer === 'undefined') {
                    throw new Error('当前浏览器环境不支持多线程SharedArrayBuffer。\n\n解决方案：\n1. Chrome/Edge浏览器本地打开：地址栏输入 chrome://flags，搜索「SharedArrayBuffer」并启用，重启浏览器后重试。\n2. 或者部署到支持COOP/COEP头的Web服务器（如Cloudflare Pages）上运行。');
                }

                // 显示加载状态，起始进度0%
                updateStatus('正在下载FFmpeg内核（首次使用约30MB，后续缓存复用）...', 'loading', 0);

                // 从FFmpeg对象中解构出FFmpeg类和fetchFile工具函数
                const { FFmpeg } = FFmpegWASM;
                // 从ffmpegUtil对象中解构出fetchFile工具函数
                const { fetchFile, toBlobURL } = FFmpegUtil;

                // 创建FFmpeg实例
                ffmpeg = new FFmpeg();

                // 注册内核下载进度回调事件
                ffmpeg.on('progress', ({ progress, time }) => {
                    // 将0-1的进度转换为0-100的百分比（限制在0-99，最后100由exec完成后设置）
                    const percent = Math.round(progress * 99);
                    updateStatus('正在转换音频中，请耐心等待...', 'processing', percent);
                });

                // 定义CDN基础URL（使用jsDelivr保证国内访问速度）
                const baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';

                // 动态加载核心二进制文件的Blob URL（浏览器会自动缓存，二次打开无需重下）
                const coreURL = await toBlobURL(
                    `${baseURL}/ffmpeg-core.js`,      // 核心JS文件URL
                    'text/javascript'                  // MIME类型
                );
                updateStatus('正在加载FFmpeg内核组件 1/4...', 'loading', 25);

                // 加载WASM核心模块
                const wasmURL = await toBlobURL(
                    `${baseURL}/ffmpeg-core.wasm`,    // WASM二进制文件URL
                    'application/wasm'                 // MIME类型
                );
                updateStatus('正在加载FFmpeg内核组件 2/4...', 'loading', 50);

                // 加载多线程Worker文件
                const workerURL = await toBlobURL(
                    `${baseURL}/ffmpeg-core.worker.js`, // Worker线程文件URL
                    'text/javascript'                    // MIME类型
                );
                updateStatus('正在加载FFmpeg内核组件 3/4...', 'loading', 75);

                // 加载SIMD版本Worker（高性能多线程）
                const simdCoreURL = await toBlobURL(
                    `${baseURL}/ffmpeg-core-simd.js`,  // SIMD版核心JS（可选回退）
                    'text/javascript'
                );
                updateStatus('正在初始化FFmpeg引擎 4/4...', 'loading', 90);

                // 调用load方法加载内核，传入4个URL参数
                await ffmpeg.load({
                    coreURL: coreURL,          // 核心JS
                    wasmURL: wasmURL,          // WASM模块
                    workerURL: workerURL,      // Worker文件
                    simdCoreURL: simdCoreURL   // SIMD优化版（可选）
                });

                // 标记加载完成
                ffmpegLoaded = true;
                updateStatus('FFmpeg内核加载完成！', 'loading', 100);

                return true;

            } catch (error) {
                // 记录错误到控制台便于调试
                console.error('FFmpeg加载失败:', error);
                // 销毁失败的实例
                try {
                    if (ffmpeg) {
                        await ffmpeg.terminate();
                    }
                } catch (e) { /* 忽略 */ }
                ffmpeg = null;
                ffmpegLoaded = false;

                // 更新状态为失败
                updateStatus('FFmpeg内核加载失败', 'error', 0);

                // 显示友好错误提示弹窗
                if (error.message && error.message.includes('SharedArrayBuffer')) {
                    showModal(
                        '浏览器环境不支持',
                        error.message
                    );
                } else if (error.message && error.message.includes('Network') || (error.message && error.message.includes('fetch') || error.message && error.message.includes('Failed to fetch'))) {
                    showModal(
                        '网络连接失败',
                        '无法下载FFmpeg内核文件，可能是网络原因或CDN被屏蔽。\n\n请检查网络连接后刷新重试。\n如果是本地双击打开，建议部署到Cloudflare Pages等支持HTTPS的静态网站托管服务后使用。'
                    );
                } else {
                    showModal(
                        '内核加载失败',
                        'FFmpeg内核加载过程中发生错误：\n' + (error.message || '未知错误') + '\n\n建议刷新页面后重试。'
                    );
                }

                throw error;
            }
        }

        // ============================================================
        // 文件选择与处理函数
        // ============================================================

        /**
         * 处理用户选择的文件，校验并更新UI
         * @param {File} file - 用户选择的视频文件
         */
        function handleSelectedFile(file) {
            // 如果未选择文件，直接返回
            if (!file) return;

            // 检查文件大小，建议上限4GB（FFmpeg内存限制）
            const MAX_SIZE = 4 * 1024 * 1024 * 1024; // 4GB
            if (file.size > MAX_SIZE) {
                showModal(
                    '文件过大',
                    '您选择的视频文件超过4GB限制，浏览器内存可能无法处理。\n\n请选择较小的视频文件，或在本地使用桌面版FFmpeg处理。'
                );
                return;
            }

            // 检查文件扩展名是否支持
            const allowedExts = ['mp4', 'mkv', 'mov', 'avi', 'flv', 'webm', 'm4v', 'wmv', 'ts', 'mts'];
            const fileExt = file.name.split('.').pop().toLowerCase();
            // 同时也检查MIME类型是否是视频类
            const isVideoType = file.type.startsWith('video/') || allowedExts.includes(fileExt);

            if (!isVideoType) {
                showModal(
                    '文件格式不支持',
                    '您选择的文件格式不在支持范围内。\n\n请选择以下格式的视频文件：\nMP4、MKV、MOV、AVI、FLV、WebM'
                );
                return;
            }

            // 保存选中的文件到全局变量
            selectedFile = file;

            // 更新UI显示文件信息
            fileName.textContent = file.name;
            fileSize.textContent = '文件大小：' + formatFileSize(file.size);
            fileInfo.classList.add('show');

            // 启用转换按钮
            convertBtn.disabled = false;

            // 隐藏之前的结果面板和状态面板
            resultPanel.classList.remove('show');
            hideStatus();

            // 清理旧的音频数据
            outputAudioBlob = null;
            revokeLastObjectUrl();
        }

        /**
         * 移除已选择的文件，重置UI
         */
        function removeSelectedFile() {
            // 清空文件选择input
            fileInput.value = '';
            // 清空全局文件变量
            selectedFile = null;
            // 隐藏文件信息
            fileInfo.classList.remove('show');
            // 禁用转换按钮
            convertBtn.disabled = true;
            // 隐藏结果面板
            resultPanel.classList.remove('show');
            // 隐藏状态面板
            hideStatus();
            // 清理音频数据
            outputAudioBlob = null;
            revokeLastObjectUrl();
        }

        // ============================================================
        // FFmpeg转换音频核心逻辑
        // ============================================================

        /**
         * 构建FFmpeg命令参数数组
         * @param {string} inputName - 输入文件名（虚拟文件系统中的路径）
         * @param {string} outputName - 输出文件名
         * @returns {string[]} FFmpeg命令参数数组
         */
        function buildFFmpegArgs(inputName, outputName) {
            // 从UI获取各项参数
            const format = formatSelect.value;         // 输出格式
            const bitrate = bitrateSelect.value;       // 比特率
            const channels = channelSelect.value;      // 声道数
            const useTimeCut = timeToggle.checked;     // 是否截取片段
            const startTime = startTimeInput.value;    // 起始时间
            const endTime = endTimeInput.value;        // 结束时间

            // 初始化命令参数数组
            const args = [];

            // ========== 输入参数部分 ==========

            // 如果启用了片段截取且起始时间有效，使用-ss快速定位（放在-i前可加速Seek）
            if (useTimeCut && startTime !== '' && !isNaN(parseFloat(startTime)) && parseFloat(startTime) > 0) {
                args.push('-ss', String(parseFloat(startTime)));
            }

            // 指定输入文件
            args.push('-i', inputName);

            // 如果启用了截取且有结束时间，计算持续时长（结束-起始），使用-t参数
            if (useTimeCut && endTime !== '' && !isNaN(parseFloat(endTime))) {
                const endSec = parseFloat(endTime);
                const startSec = (startTime !== '' && !isNaN(parseFloat(startTime))) ? parseFloat(startTime) : 0;
                const duration = endSec - startSec;
                if (duration > 0) {
                    args.push('-t', String(duration));
                }
            }

            // ========== 音频处理参数部分 ==========

            // 去除视频流，只保留音频（关键参数）
            args.push('-vn');

            // 设置音频声道数（1=单声道，2=立体声）
            args.push('-ac', channels);

            // 根据输出格式设置音频编码器和比特率
            switch (format) {
                case 'mp3':
                    // MP3格式使用libmp3lame编码器
                    args.push('-c:a', 'libmp3lame');
                    // 设置比特率（VBR或CBR模式，这里统一用CBR保证码率精确）
                    args.push('-b:a', bitrate);
                    break;

                case 'aac':
                    // AAC格式使用内置aac编码器
                    args.push('-c:a', 'aac');
                    // 设置比特率
                    args.push('-b:a', bitrate);
                    break;

                case 'wav':
                    // WAV无损格式使用PCM 16位小端编码，忽略比特率设置
                    args.push('-c:a', 'pcm_s16le');
                    // 可选设置采样率为44100Hz保持兼容
                    args.push('-ar', '44100');
                    break;

                case 'flac':
                    // FLAC无损格式使用flac编码器，忽略比特率设置
                    args.push('-c:a', 'flac');
                    // FLAC压缩级别5（默认），范围0-12
                    args.push('-compression_level', '5');
                    break;
            }

            // ========== 输出参数部分 ==========

            // 覆盖已存在的输出文件（无提示）
            args.push('-y');

            // 最后指定输出文件名
            args.push(outputName);

            // 返回完整命令参数数组
            return args;
        }

        /**
         * 执行音频转换的主流程
         */
        async function convertAudio() {
            // 基础校验：必须选中文件
            if (!selectedFile) {
                showModal('请先选择文件', '请先选择一个视频文件再开始转换。');
                return;
            }

            // 校验时间参数有效性（如果启用了截取）
            if (timeToggle.checked) {
                const startVal = startTimeInput.value;
                const endVal = endTimeInput.value;
                let startSec = null;
                let endSec = null;

                // 解析起始时间
                if (startVal !== '') {
                    startSec = parseFloat(startVal);
                    if (isNaN(startSec) || startSec < 0) {
                        showModal('时间参数错误', '起始时间必须是大于等于0的有效数字。');
                        return;
                    }
                }
                // 解析结束时间
                if (endVal !== '') {
                    endSec = parseFloat(endVal);
                    if (isNaN(endSec) || endSec < 0) {
                        showModal('时间参数错误', '结束时间必须是大于等于0的有效数字。');
                        return;
                    }
                }
                // 结束时间必须大于起始时间
                if (startSec !== null && endSec !== null && endSec <= startSec) {
                    showModal('时间参数错误', '结束时间必须大于起始时间！');
                    return;
                }
            }

            // 禁用转换按钮防止重复点击
            convertBtn.disabled = true;
            // 禁用移除按钮
            removeBtn.disabled = true;
            // 隐藏结果面板
            resultPanel.classList.remove('show');
            // 清理旧的音频数据
            outputAudioBlob = null;
            revokeLastObjectUrl();

            try {
                // ========== 第1步：加载FFmpeg内核 ==========
                await loadFFmpeg();

                // 生成虚拟文件系统中的输入输出文件名
                const inputName = 'input_video';
                const outputFormat = formatSelect.value;
                outputExtension = outputFormat;
                const outputName = 'output_audio.' + outputExtension;

                // ========== 第2步：将用户视频文件写入FFmpeg虚拟文件系统 ==========
                updateStatus('正在读取视频文件到内存...', 'processing', 2);
                // 解构fetchFile工具（将File对象转为Uint8Array）
                const { fetchFile } = FFmpegUtil;
                // 写入文件到FFmpeg MEMFS
                await ffmpeg.writeFile(inputName, await fetchFile(selectedFile));

                // ========== 第3步：构建并执行FFmpeg命令 ==========
                updateStatus('正在构建转换命令...', 'processing', 5);
                const args = buildFFmpegArgs(inputName, outputName);

                // 在控制台打印命令参数，便于调试
                console.log('FFmpeg执行命令: ffmpeg ' + args.join(' '));

                updateStatus('开始提取音频，大文件请耐心等待...', 'processing', 8);
                // 执行FFmpeg命令（progress事件会持续更新进度）
                await ffmpeg.exec(args);

                // ========== 第4步：读取输出音频数据 ==========
                updateStatus('正在读取导出的音频文件...', 'processing', 98);
                // 从FFmpeg虚拟文件系统中读取输出文件，得到Uint8Array
                const outputData = await ffmpeg.readFile(outputName);

                // 根据输出格式设置正确的MIME类型
                let mimeType;
                switch (outputFormat) {
                    case 'mp3': mimeType = 'audio/mpeg'; break;
                    case 'aac': mimeType = 'audio/aac'; break;
                    case 'wav': mimeType = 'audio/wav'; break;
                    case 'flac': mimeType = 'audio/flac'; break;
                    default: mimeType = 'application/octet-stream';
                }

                // 将Uint8Array转为Blob对象便于浏览器播放和下载
                outputAudioBlob = new Blob([outputData], { type: mimeType });

                // 释放FFmpeg虚拟文件系统中的文件（减少内存占用）
                try {
                    await ffmpeg.deleteFile(inputName);
                    await ffmpeg.deleteFile(outputName);
                } catch (e) {
                    // 删除失败不影响结果，仅记录
                    console.warn('清理虚拟文件时出错（可忽略）:', e);
                }

                // ========== 第5步：更新UI显示结果 ==========
                updateStatus('🎉 音频提取成功！', 'success', 100);

                // 创建Blob URL供音频播放器使用
                lastObjectUrl = URL.createObjectURL(outputAudioBlob);
                // 设置播放器的src
                audioPlayer.src = lastObjectUrl;

                // 预填充下载文件名（使用原视频文件名+新扩展名）
                const originalBaseName = selectedFile.name
                    .replace(/\.[^/.]+$/, '')     // 去掉原扩展名
                    .replace(/[\\/:*?"<>|]/g, '_'); // 替换非法字符
                filenameInput.value = originalBaseName + '_audio';

                // 显示结果面板
                resultPanel.classList.add('show');

                // 滚动页面到结果区
                resultPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            } catch (error) {
                // 记录详细错误到控制台
                console.error('音频转换失败:', error);

                // 更新状态为失败
                updateStatus('转换失败', 'error', 0);

                // 分析错误类型并给出友好提示
                const errMsg = (error.message || String(error) || '').toLowerCase();

                if (errMsg.includes('memory') || errMsg.includes('out of memory') || errMsg.includes('oom') || error.name === 'RangeError') {
                    showModal(
                        '浏览器内存不足',
                        '视频文件过大导致浏览器内存溢出。\n\n建议解决方案：\n1. 选择更小的视频文件\n2. 关闭其他占用内存的浏览器标签页后重试\n3. 使用电脑端本地版FFmpeg软件处理'
                    );
                } else if (errMsg.includes('invalid') || errMsg.includes('corrupt') || errMsg.includes('broken') || errMsg.includes('moov') || errMsg.includes('not find')) {
                    showModal(
                        '视频文件损坏或不兼容',
                        '无法读取该视频文件，可能原因：\n1. 文件下载不完整，已损坏\n2. 视频编码格式特殊，FFmpeg无法识别\n3. 文件受DRM版权保护\n\n请尝试使用其他视频文件。'
                    );
                } else if (errMsg.includes('duration') || errMsg.includes('start') || errMsg.includes('time')) {
                    showModal(
                        '截取时间参数无效',
                        '您填写的起始/结束时间超出了视频实际长度，或格式错误。\n\n请检查时间后重试。'
                    );
                } else {
                    showModal(
                        '转换失败',
                        '音频提取过程中发生错误：\n' + (error.message || '未知错误') + '\n\n请刷新页面后重试，或尝试更换视频文件。'
                    );
                }

            } finally {
                // 无论成功失败，重新启用移除文件按钮
                removeBtn.disabled = false;
                // 重新启用转换按钮（如果有选中文件的话）
                convertBtn.disabled = !selectedFile;
            }
        }

        // ============================================================
        // 下载功能
        // ============================================================

        /**
         * 下载导出的音频文件
         */
        function downloadAudio() {
            // 检查是否有可下载的音频
            if (!outputAudioBlob) {
                showModal('无音频可下载', '请先完成音频转换后再下载。');
                return;
            }

            // 获取用户输入的文件名，去除首尾空白
            let customName = filenameInput.value.trim();

            // 如果用户没输入文件名，使用默认名
            if (!customName) {
                customName = 'extracted_audio';
            }

            // 再次移除用户可能手动输入的扩展名和非法字符
            customName = customName
                .replace(/\.[^/.]+$/, '')
                .replace(/[\\/:*?"<>|]/g, '_');

            // 组合完整文件名（加上扩展名）
            const fullFileName = customName + '.' + outputExtension;

            // 创建临时<a>标签实现下载
            const tempLink = document.createElement('a');
            // 使用已有的Blob URL或新建一个
            const url = lastObjectUrl || URL.createObjectURL(outputAudioBlob);
            tempLink.href = url;
            // 设置下载文件名
            tempLink.download = fullFileName;
            // 防止某些浏览器新开标签
            tempLink.target = '_self';
            // 将临时链接挂到DOM上
            document.body.appendChild(tempLink);
            // 触发点击下载
            tempLink.click();
            // 移除临时链接
            document.body.removeChild(tempLink);
        }

        // ============================================================
        // 事件绑定区
        // ============================================================

        // ---- 文件上传区点击：触发隐藏的文件选择框 ----
        uploadArea.addEventListener('click', function () {
            fileInput.click();
        });

        // ---- 文件选择框change事件：获取用户选的文件 ----
        fileInput.addEventListener('change', function (e) {
            if (e.target.files && e.target.files.length > 0) {
                handleSelectedFile(e.target.files[0]);
            }
        });

        // ---- 拖拽事件：dragenter拖拽进入上传区 ----
        uploadArea.addEventListener('dragenter', function (e) {
            // 阻止默认行为
            e.preventDefault();
            e.stopPropagation();
            // 添加拖拽悬停样式
            uploadArea.classList.add('dragover');
        });

        // ---- 拖拽事件：dragover悬停在上传区 ----
        uploadArea.addEventListener('dragover', function (e) {
            // 必须阻止默认，浏览器默认会直接打开文件
            e.preventDefault();
            e.stopPropagation();
            // 添加样式（保险重复加）
            uploadArea.classList.add('dragover');
        });

        // ---- 拖拽事件：dragleave离开上传区 ----
        uploadArea.addEventListener('dragleave', function (e) {
            e.preventDefault();
            e.stopPropagation();
            // 只有真正离开上传区元素本身才移除样式
            if (e.target === uploadArea) {
                uploadArea.classList.remove('dragover');
            }
        });

        // ---- 拖拽事件：drop用户释放文件 ----
        uploadArea.addEventListener('drop', function (e) {
            // 必须阻止默认，否则浏览器会直接打开文件
            e.preventDefault();
            e.stopPropagation();
            // 移除拖拽样式
            uploadArea.classList.remove('dragover');
            // 处理第一个文件
            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleSelectedFile(e.dataTransfer.files[0]);
            }
        });

        // ---- 全局drop事件：防止用户拖到页面其他位置直接打开文件 ----
        document.addEventListener('dragover', function (e) {
            e.preventDefault();
        });
        document.addEventListener('drop', function (e) {
            e.preventDefault();
        });

        // ---- 移除文件按钮点击事件 ----
        removeBtn.addEventListener('click', removeSelectedFile);

        // ---- 时间截取开关change事件 ----
        timeToggle.addEventListener('change', function () {
            if (timeToggle.checked) {
                // 启用：移除disabled类，启用输入框
                timeInputs.classList.remove('disabled');
                startTimeInput.disabled = false;
                endTimeInput.disabled = false;
                // 聚焦起始时间输入框方便用户输入
                startTimeInput.focus();
            } else {
                // 禁用：添加disabled类，禁用输入框，清空值
                timeInputs.classList.add('disabled');
                startTimeInput.disabled = true;
                endTimeInput.disabled = true;
                startTimeInput.value = '';
                endTimeInput.value = '';
            }
        });

        // ---- 转换按钮点击事件 ----
        convertBtn.addEventListener('click', convertAudio);

        // ---- 下载按钮点击事件 ----
        downloadBtn.addEventListener('click', downloadAudio);

        // ---- 弹窗关闭按钮点击事件 ----
        modalCloseBtn.addEventListener('click', hideModal);

        // ---- 点击弹窗遮罩关闭弹窗 ----
        modalOverlay.addEventListener('click', function (e) {
            // 只有点击遮罩本身（非内容区）才关闭
            if (e.target === modalOverlay) {
                hideModal();
            }
        });

        // ---- ESC键关闭弹窗 ----
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && modalOverlay.classList.contains('show')) {
                hideModal();
            }
        });

        // ---- 页面关闭前清理内存，防止内存泄漏 ----
        window.addEventListener('beforeunload', function () {
            // 释放Blob URL
            revokeLastObjectUrl();
            // 注意：async的terminate在beforeunload中可能无法完成，
            // 但浏览器会在页面卸载后自动释放WASM内存，做了比没做好
        });

        // ============================================================
        // 页面加载完成后执行的初始化逻辑
        // ============================================================
        (function init() {
            // 控制台打印工具信息，便于调试
            console.log('%c🎬 视频提取音频工具已加载', 'color: #2563eb; font-size: 16px; font-weight: bold;');
            console.log('%c💡 所有处理均在本地浏览器完成，保护隐私安全！', 'color: #059669; font-weight: 500;');

            // 检测SharedArrayBuffer支持情况并提示
            if (typeof SharedArrayBuffer === 'undefined') {
                // 延迟显示提示，让页面先渲染完成
                setTimeout(function () {
                    showModal(
                        '⚠️ 环境提示',
                        '检测到当前浏览器环境可能不支持多线程模式。\n\n如果转换功能无法使用，请：\n1. 部署到Cloudflare Pages等配置了COOP/COEP响应头的HTTPS服务器\n2. 或本地启用Chrome实验性功能：地址栏输入 chrome://flags，搜索并启用「SharedArrayBuffer」后重启浏览器'
                    );
                }, 600);
            }
        })();
    </script>
